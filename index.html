<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerFan | Социальная сеть для геймеров</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f13; --card: #1a1a24; --text: #e0e0e0; --sec: #a0a0b0; --acc: #ff0055; --pri: #00d4ff; --border: #2a2a35; }
        [data-theme="dark"] { --bg: #0a0a0a; --card: #141414; --text: #fff; --sec: #ccc; --acc: #ff4757; --pri: #fff; --border: #333; }
        [data-theme="black"] { --bg: #000; --card: #0a0a0a; --text: #fff; --sec: #aaa; --acc: #ff4757; --pri: #fff; --border: #222; }
        [data-theme="light"] { --bg: #f5f5f5; --card: #fff; --text: #1a1a1a; --sec: #555; --acc: #ff4757; --pri: #1a1a1a; --border: #ddd; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        h1,h2,h3,.logo { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a24 0%, #000 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: rgba(26,26,36,0.95); padding: 30px; border-radius: 15px; border: 1px solid var(--acc); box-shadow: 0 0 20px rgba(255,0,85,0.4); text-align: center; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .inp { width: 100%; padding: 12px; margin: 6px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px; }
        .btn { background: transparent; border: 2px solid var(--acc); color: var(--acc); padding: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 8px; width: 100%; margin-top: 10px; font-family: 'Orbitron', sans-serif; }
        .btn:hover { background: var(--acc); color: #fff; }
        .btn-sm { width: auto; padding: 5px 15px; font-size: 12px; }
        .btn-danger { background: #ff3333; border-color: #ff3333; color: #fff; }
        .link { color: var(--acc); cursor: pointer; font-size: 14px; }
        .link:hover { text-decoration: underline; }

        #app { display: none; height: 100%; flex-direction: column; }
        #app.on { display: flex; }
        header { height: 55px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .logo { font-size: 22px; color: var(--acc); cursor: pointer; }
        nav { display: flex; gap: 15px; }
        .nav-i { cursor: pointer; color: var(--sec); font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .nav-i:hover, .nav-i.active { color: var(--pri); }
        .user-mini { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .mini-av { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--acc); object-fit: cover; background: #333; }

        main { flex: 1; overflow-y: auto; padding: 15px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .post-nick { font-weight: bold; color: var(--pri); }
        .post-time { font-size: 11px; color: var(--sec); }
        .post-text { margin: 10px 0; white-space: pre-wrap; }
        .post-image { width: 100%; border-radius: 5px; max-height: 300px; object-fit: contain; margin: 10px 0; }
        .post-actions { display: flex; gap: 15px; border-top: 1px solid var(--border); padding-top: 10px; }
        .act-btn { background: none; border: none; color: var(--sec); cursor: pointer; font-size: 14px; }
        .act-btn:hover { color: var(--pri); }
        .act-btn.liked { color: var(--acc); }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .game-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
        .game-card:hover { transform: translateY(-3px); border-color: var(--pri); }
        .game-icon { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 35px; background: #000; }
        .game-info { padding: 10px; }
        .game-title { font-weight: bold; font-size: 13px; }
        .game-cat { font-size: 11px; color: var(--acc); text-transform: uppercase; }

        .games-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab { padding: 6px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; color: var(--sec); }
        .tab.active, .tab:hover { background: var(--acc); color: #fff; }

        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 4000; display: none; flex-direction: column; }
        #game-frame { flex: 1; border: none; }
        #game-header { height: 45px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; border: 1px solid var(--acc); position: relative; }
        .modal-close { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: var(--sec); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); border-left: 4px solid var(--pri); padding: 12px 18px; border-radius: 5px; z-index: 3000; }
        footer { text-align: center; padding: 15px; color: var(--sec); font-size: 12px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="auth-screen"><div class="auth-box" id="auth-box"></div></div>

    <div id="app">
        <header>
            <div class="logo" onclick="switchTab('feed')">GAMER<span style="color:#fff">FAN</span></div>
            <nav>
                <div class="nav-i active" data-tab="feed"><i class="fas fa-home"></i> Лента</div>
                <div class="nav-i" data-tab="games"><i class="fas fa-gamepad"></i> Игры</div>
                <div class="nav-i" data-tab="settings"><i class="fas fa-cog"></i> Настройки</div>
            </nav>
            <div class="user-mini" onclick="switchTab('settings')">
                <img id="header-av" class="mini-av" src="">
                <span id="header-nick"></span>
            </div>
        </header>
        <main>
            <section id="feed" class="section active">
                <div class="card" style="display:flex; gap:10px; align-items:center;">
                    <div style="flex:1; color:var(--sec); cursor:pointer;" onclick="openPostModal()">О чем думаешь, геймер?</div>
                    <button class="btn btn-sm" onclick="openPostModal()">Пост</button>
                </div>
                <div id="feed-box"></div>
            </section>
            <section id="games" class="section">
                <h2>🎮 Игры</h2>
                <div class="games-tabs" id="games-tabs">
                    <div class="tab active" data-cat="all">Все</div>
                    <div class="tab" data-cat="slime">Slime</div>
                    <div class="tab" data-cat="elberr_old">ELBERR OS</div>
                    <div class="tab" data-cat="elberr_new">Remake</div>
                    <div class="tab" data-cat="dlc">DLC</div>
                    <div class="tab" data-cat="daardos">Daardos</div>
                </div>
                <div class="games-grid" id="games-box"></div>
            </section>
            <section id="settings" class="section">
                <div class="card">
                    <h3>👤 Профиль</h3>
                    <p><strong id="set-nick"></strong></p>
                    <p style="color:var(--sec);">Имя: <span id="set-name"></span></p>
                    <p style="color:var(--sec);">Возраст: <span id="set-age"></span></p>
                    <label>Сменить ник:</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="new-nick" class="inp" placeholder="Новый ник">
                        <button class="btn btn-sm" onclick="changeNick()">OK</button>
                    </div>
                    <label>Сменить аватар (URL):</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="new-av" class="inp" placeholder="Ссылка на картинку">
                        <button class="btn btn-sm" onclick="changeAv()">OK</button>
                    </div>
                </div>
                <div class="card">
                    <h3>🎨 Тема</h3>
                    <button class="btn btn-sm" onclick="setTheme('cyberpunk')">Киберпанк</button>
                    <button class="btn btn-sm" onclick="setTheme('dark')">Тёмная</button>
                    <button class="btn btn-sm" onclick="setTheme('black')">Чёрная</button>
                    <button class="btn btn-sm" onclick="setTheme('light')">Светлая</button>
                </div>
                <button class="btn btn-danger" onclick="logout()">🚪 Выйти</button>
            </section>
        </main>
        <footer>GamerFan &copy; 2026 | <a onclick="alert('Политика: сохраняем ник, имя, возраст. Пароли хешируются.')" style="color:var(--pri);cursor:pointer;">Политика</a></footer>
    </div>

    <div id="post-modal" class="modal">
        <div class="modal-box">
            <span class="modal-close" onclick="closePostModal()">&times;</span>
            <h3>Новый пост</h3>
            <textarea id="post-text" class="inp" rows="4"></textarea>
            <input type="text" id="post-img" class="inp" placeholder="Ссылка на картинку (необяз.)">
            <button class="btn" onclick="createPost()">Опубликовать</button>
        </div>
    </div>

    <div id="game-overlay">
        <div id="game-header"><span id="game-title"></span><button class="btn btn-sm" onclick="closeGame()">Закрыть</button></div>
        <iframe id="game-frame"></iframe>
    </div>

    <script>
        const NEON_URL = 'https://ep-summer-union-ab3fgtra.eu-west-2.aws.neon.tech/neondb';
        const NEON_KEY = 'neondb_owner:npg_2owpCrhvUs5k';
        const BASE = '/GamerFan';
        const GAMES = [
            {n:"Slime Clicker 2D",p:BASE+"/Slime_Clicker/index.html",i:"🧪",c:"slime"},
            {n:"Slime Farm 2D",p:BASE+"/Slime_Farm_2D/index.html",i:"🚜",c:"slime"},
            {n:"Slime Farm 2",p:BASE+"/Slime_Farm2/index.html",i:"🍄",c:"slime"},
            {n:"ELBERR OS: Ch 1",p:BASE+"/ELBERR_OS/Chapter1/index.html",i:"💾",c:"elberr_old"},
            {n:"ELBERR OS: Ch 2",p:BASE+"/ELBERR_OS/Chapter2/index.html",i:"🔐",c:"elberr_old"},
            {n:"ELBERR OS: Ch 3",p:BASE+"/ELBERR_OS/Chapter3/index.html",i:"⚙️",c:"elberr_old"},
            {n:"ELBERR OS: Ch 4",p:BASE+"/ELBERR_OS/Chapter4/index.html",i:"💿",c:"elberr_old"},
            {n:"ELBERR OS: Ch 5",p:BASE+"/ELBERR_OS/Chapter5/index.html",i:"📡",c:"elberr_old"},
            {n:"ELBERR OS: Ch 6",p:BASE+"/ELBERR_OS/Chapter6/index.html",i:"🧠",c:"elberr_old"},
            {n:"ELBERR OS R: Ch 1",p:BASE+"/ELBERR_OS_REMAKE/Chapter1/index.html",i:"🆕",c:"elberr_new"},
            {n:"ELBERR OS R: Ch 2",p:BASE+"/ELBERR_OS_REMAKE/Chapter2/index.html",i:"✨",c:"elberr_new"},
            {n:"ELBERR OS R: Ch 3",p:BASE+"/ELBERR_OS_REMAKE/Chapter3/index.html",i:"🚀",c:"elberr_new"},
            {n:"ELBERR OS R: Ch 4",p:BASE+"/ELBERR_OS_REMAKE/Chapter4/index.html",i:"💫",c:"elberr_new"},
            {n:"ELBERR OS R: Ch 5",p:BASE+"/ELBERR_OS_REMAKE/Chapter5/index.html",i:"⚡",c:"elberr_new"},
            {n:"ELBERR OS R: Ch 6",p:BASE+"/ELBERR_OS_REMAKE/Chapter6/index.html",i:"🔥",c:"elberr_new"},
            {n:"RTAP DLC",p:BASE+"/ELBERR_OS_REMAKE/RTAP/index.html",i:"🦾",c:"dlc"},
            {n:"TAD DLC",p:BASE+"/ELBERR_OS_REMAKE/TAD/index.html",i:"🔥",c:"dlc"},
            {n:"TPD DLC",p:BASE+"/ELBERR_OS_REMAKE/TPD/index.html",i:"🔥",c:"dlc"},
            {n:"Neon Bird",p:BASE+"/daardos/neon_bird/index.html",i:"🐦",c:"daardos"}
        ];

        let me = null;

        function $(id) { return document.getElementById(id); }
        function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        async function sql(query) {
            const r = await fetch(NEON_URL + '/sql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(NEON_KEY) },
                body: JSON.stringify({ query })
            });
            return r.json();
        }

        function showAuth(m) {
            if (m === 'login') {
                $('auth-box').innerHTML = `<h1 class="logo">GAMER<span style="color:#fff">FAN</span></h1>
                <h3>Вход</h3><input id="l-nick" class="inp" placeholder="Никнейм">
                <input id="l-pass" class="inp" type="password" placeholder="Пароль">
                <button class="btn" onclick="login()">Войти</button>
                <p style="margin-top:10px;"><span class="link" onclick="showAuth('reg')">Регистрация</span></p>`;
            } else {
                $('auth-box').innerHTML = `<h1 class="logo">GAMER<span style="color:#fff">FAN</span></h1>
                <h3>Регистрация</h3><input id="r-name" class="inp" placeholder="Имя">
                <input id="r-nick" class="inp" placeholder="Никнейм">
                <input id="r-age" class="inp" type="number" placeholder="Возраст" min="8" max="99">
                <input id="r-pass" class="inp" type="password" placeholder="Пароль">
                <button class="btn" onclick="reg()">Создать</button>
                <p style="margin-top:10px;"><span class="link" onclick="showAuth('login')">Войти</span></p>`;
            }
        }

        async function reg() {
            const name = $('r-name').value.trim(), nick = $('r-nick').value.trim(), age = +$('r-age').value, pass = $('r-pass').value;
            if (!name || !nick || !age || !pass) return toast('Все поля обязательны!');
            if (age < 8) return toast('Минимум 8 лет!');
            const hash = btoa(pass);
            const { rows } = await sql(`INSERT INTO users (name, nickname, age, password) VALUES ('${name}', '${nick}', ${age}, '${hash}') RETURNING *`);
            if (!rows || rows.length === 0) return toast('Никнейм занят!');
            me = rows[0];
            localStorage.setItem('gf_user', JSON.stringify(me));
            enter();
        }

        async function login() {
            const nick = $('l-nick').value.trim(), pass = $('l-pass').value;
            if (!nick || !pass) return toast('Заполните поля!');
            const hash = btoa(pass);
            const { rows } = await sql(`SELECT * FROM users WHERE nickname='${nick}' AND password='${hash}'`);
            if (!rows || rows.length === 0) return toast('Неверные данные!');
            me = rows[0];
            localStorage.setItem('gf_user', JSON.stringify(me));
            enter();
        }

        function enter() {
            $('auth-screen').style.display = 'none';
            $('app').classList.add('on');
            updateUI();
            loadFeed();
            loadGames('all');
        }

        function logout() {
            me = null;
            localStorage.removeItem('gf_user');
            $('app').classList.remove('on');
            $('auth-screen').style.display = 'flex';
            showAuth('login');
        }

        function updateUI() {
            if (!me) return;
            $('header-nick').textContent = me.nickname;
            $('set-nick').textContent = me.nickname;
            $('set-name').textContent = me.name;
            $('set-age').textContent = me.age;
            $('header-av').src = me.avatar || '';
        }

        async function createPost() {
            const text = $('post-text').value.trim(), img = $('post-img').value.trim();
            if (!text && !img) return toast('Введите текст или ссылку!');
            await sql(`INSERT INTO posts (user_id, nick, text, image, avatar) VALUES (${me.id}, '${me.nickname}', '${text}', '${img}', '${me.avatar || ''}')`);
            closePostModal();
            loadFeed();
            toast('✅ Опубликовано!');
        }

        async function loadFeed() {
            const { rows } = await sql(`SELECT * FROM posts ORDER BY created_at DESC LIMIT 30`);
            const box = $('feed-box');
            if (!rows || rows.length === 0) { box.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sec);">Лента пуста</div>'; return; }
            box.innerHTML = rows.map(p => {
                const likes = JSON.parse(p.likes || '[]');
                const liked = me && likes.includes(me.nickname);
                return `<div class="card">
                    <div class="post-nick">${esc(p.nick)} <span class="post-time">${new Date(p.created_at).toLocaleString('ru')}</span></div>
                    ${p.text ? `<div class="post-text">${esc(p.text)}</div>` : ''}
                    ${p.image ? `<img src="${p.image}" class="post-image">` : ''}
                    <div class="post-actions">
                        <button class="act-btn ${liked?'liked':''}" onclick="toggleLike(${p.id})">❤️ ${likes.length}</button>
                    </div></div>`;
            }).join('');
        }

        async function toggleLike(id) {
            if (!me) return;
            const { rows } = await sql(`SELECT likes FROM posts WHERE id=${id}`);
            let likes = JSON.parse(rows[0].likes || '[]');
            likes = likes.includes(me.nickname) ? likes.filter(n => n !== me.nickname) : [...likes, me.nickname];
            await sql(`UPDATE posts SET likes='${JSON.stringify(likes)}' WHERE id=${id}`);
            loadFeed();
        }

        function openPostModal() { $('post-modal').style.display = 'flex'; }
        function closePostModal() { $('post-modal').style.display = 'none'; $('post-text').value = ''; $('post-img').value = ''; }

        function loadGames(cat) {
            const f = cat === 'all' ? GAMES : GAMES.filter(g => g.c === cat);
            $('games-box').innerHTML = f.map(g => `<div class="game-card" onclick="launchGame('${g.p}','${g.n}')"><div class="game-icon">${g.i}</div><div class="game-info"><div class="game-title">${g.n}</div><div class="game-cat">${g.c}</div></div></div>`).join('');
        }
        function launchGame(p, n) { $('game-title').textContent = n; $('game-frame').src = p; $('game-overlay').style.display = 'flex'; }
        function closeGame() { $('game-overlay').style.display = 'none'; $('game-frame').src = ''; }

        async function changeNick() {
            const nick = $('new-nick').value.trim();
            if (!nick || !me) return;
            await sql(`UPDATE users SET nickname='${nick}' WHERE id=${me.id}`);
            me.nickname = nick;
            localStorage.setItem('gf_user', JSON.stringify(me));
            updateUI();
            toast('✅ Ник изменён!');
        }
        async function changeAv() {
            const av = $('new-av').value.trim();
            if (!av || !me) return;
            await sql(`UPDATE users SET avatar='${av}' WHERE id=${me.id}`);
            me.avatar = av;
            localStorage.setItem('gf_user', JSON.stringify(me));
            updateUI();
            toast('✅ Аватар обновлён!');
        }
        function setTheme(t) {
            if (t === 'cyberpunk') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('gf_theme', t);
        }

        function switchTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-i').forEach(n => n.classList.remove('active'));
            $(id).classList.add('active');
            document.querySelector(`[data-tab="${id}"]`)?.classList.add('active');
            if (id === 'feed') loadFeed();
            if (id === 'games') loadGames('all');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('gf_user');
            if (saved) { me = JSON.parse(saved); enter(); }
            else showAuth('login');

            document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => switchTab(el.dataset.tab)));
            $('games-tabs').addEventListener('click', e => {
                const t = e.target.closest('.tab');
                if (t) { document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active'); loadGames(t.dataset.cat); }
            });
            const theme = localStorage.getItem('gf_theme') || 'cyberpunk';
            setTheme(theme);
        });
    </script>
</body>
</html>
