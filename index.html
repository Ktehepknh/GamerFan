<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerFan | Игры</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f13; --card: #1a1a24; --text: #e0e0e0; --sec: #a0a0b0; --acc: #ff0055; --pri: #00d4ff; --border: #2a2a35; }
        [data-theme="dark"] { --bg: #0a0a0a; --card: #141414; --text: #fff; --sec: #ccc; --acc: #ff4757; --pri: #fff; --border: #333; }
        [data-theme="black"] { --bg: #000; --card: #0a0a0a; --text: #fff; --sec: #aaa; --acc: #ff4757; --pri: #fff; --border: #222; }
        [data-theme="light"] { --bg: #f5f5f5; --card: #fff; --text: #1a1a1a; --sec: #555; --acc: #ff4757; --pri: #1a1a1a; --border: #ddd; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; color: var(--acc); cursor: pointer; }
        .theme-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 15px; cursor: pointer; font-size: 12px; background: var(--card); color: var(--sec); }
        .theme-btn:hover, .theme-btn.active { background: var(--acc); color: #fff; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .games-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 14px; color: var(--sec); }
        .tab:hover, .tab.active { background: var(--acc); color: #fff; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .game-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--pri); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .game-icon { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: #000; }
        .game-info { padding: 12px; }
        .game-title { font-weight: bold; font-size: 14px; margin-bottom: 3px; }
        .game-cat { font-size: 11px; color: var(--acc); text-transform: uppercase; }
        
        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        #game-frame { flex: 1; border: none; }
        #game-header { height: 45px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; }
        .btn-close { background: var(--acc); border: none; color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        
        footer { text-align: center; padding: 20px; color: var(--sec); font-size: 12px; border-top: 1px solid var(--border); margin-top: 30px; }
        footer a { color: var(--pri); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎮 GAMER<span style="color:#fff">FAN</span></div>
        <div class="theme-btns">
            <button class="theme-btn active" onclick="setTheme('cyberpunk')">🎮 Киберпанк</button>
            <button class="theme-btn" onclick="setTheme('dark')">🌙 Тёмная</button>
            <button class="theme-btn" onclick="setTheme('black')">🖤 Чёрная</button>
            <button class="theme-btn" onclick="setTheme('light')">☀️ Светлая</button>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom:20px;">🎮 Библиотека игр</h2>
        
        <div class="games-tabs" id="games-tabs">
            <div class="tab active" data-cat="all">Все</div>
            <div class="tab" data-cat="slime">🧪 Slime</div>
            <div class="tab" data-cat="elberr_old">💾 ELBERR OS</div>
            <div class="tab" data-cat="elberr_new">🆕 Remake</div>
            <div class="tab" data-cat="elberr_2">⭐ ELBERR OS 2</div>
            <div class="tab" data-cat="dlc">🔥 DLC</div>
            <div class="tab" data-cat="daardos">🐦 Daardos</div>
        </div>
        
        <div class="games-grid" id="games-container"></div>
    </div>

    <footer>
        <p>GamerFan &copy; 2026 | 
        <a href="https://github.com/Ktehepknh/GamerFan" target="_blank">GitHub</a> | 
        Партнёр: <a href="https://daardos.github.io/the_daardos/" target="_blank">The Daardos Project</a></p>
    </footer>

    <div id="game-overlay">
        <div id="game-header">
            <span id="game-title-display">Игра</span>
            <button class="btn-close" onclick="closeGame()">✕ Закрыть</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const GAMES = [
            // Slime
            {name:"Slime Clicker 2D",path:"Slime_Clicker/index.html",icon:"🧪",cat:"slime"},
            {name:"Slime Farm 2D",path:"Slime_Farm_2D/index.html",icon:"🚜",cat:"slime"},
            {name:"Slime Farm 2",path:"Slime_Farm2/index.html",icon:"🍄",cat:"slime"},
            // ELBERR OS
            {name:"ELBERR OS: Ch 1",path:"ELBERR_OS/Chapter1/index.html",icon:"💾",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 2",path:"ELBERR_OS/Chapter2/index.html",icon:"🔐",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 3",path:"ELBERR_OS/Chapter3/index.html",icon:"⚙️",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 4",path:"ELBERR_OS/Chapter4/index.html",icon:"💿",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 5",path:"ELBERR_OS/Chapter5/index.html",icon:"📡",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 6",path:"ELBERR_OS/Chapter6/index.html",icon:"🧠",cat:"elberr_old"},
            // Remake
            {name:"ELBERR OS R: Ch 1",path:"ELBERR_OS_REMAKE/Chapter1/index.html",icon:"🆕",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 2",path:"ELBERR_OS_REMAKE/Chapter2/index.html",icon:"✨",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 3",path:"ELBERR_OS_REMAKE/Chapter3/index.html",icon:"🚀",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 4",path:"ELBERR_OS_REMAKE/Chapter4/index.html",icon:"💫",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 5",path:"ELBERR_OS_REMAKE/Chapter5/index.html",icon:"⚡",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 6",path:"ELBERR_OS_REMAKE/Chapter6/index.html",icon:"🔥",cat:"elberr_new"},
            // ELBERR OS 2 (НОВАЯ!)
            {name:"ELBERR OS 2: Ch 1",path:"ELBERR OS 2/Chapter 1/index.html",icon:"⭐",cat:"elberr_2"},
            // DLC
            {name:"RTAP DLC",path:"ELBERR_OS_REMAKE/RTAP/index.html",icon:"🦾",cat:"dlc"},
            {name:"TAD DLC",path:"ELBERR_OS_REMAKE/TAD/index.html",icon:"🔥",cat:"dlc"},
            {name:"TPD DLC",path:"ELBERR_OS_REMAKE/TPD/index.html",icon:"🔥",cat:"dlc"},
            // Daardos
            {name:"Neon Bird",path:"daardos/neon_bird/index.html",icon:"🐦",cat:"daardos"}
        ];

        function loadGames(cat) {
            const filtered = cat === 'all' ? GAMES : GAMES.filter(g => g.cat === cat);
            document.getElementById('games-container').innerHTML = filtered.map(g => `
                <div class="game-card" onclick="launchGame('${g.path}','${g.name}')">
                    <div class="game-icon">${g.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${g.name}</div>
                        <div class="game-cat">${g.cat}</div>
                    </div>
                </div>
            `).join('');
        }

        function launchGame(path, name) {
            document.getElementById('game-title-display').textContent = name;
            document.getElementById('game-frame').src = path;
            document.getElementById('game-overlay').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }

        function setTheme(t) {
            if (t === 'cyberpunk') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('gf_theme', t);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('games-tabs').addEventListener('click', e => {
            const tab = e.target.closest('.tab');
            if (tab) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadGames(tab.dataset.cat);
            }
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });

        loadGames('all');
        const savedTheme = localStorage.getItem('gf_theme') || 'cyberpunk';
        setTheme(savedTheme);
    </script>
</body>
</html>
