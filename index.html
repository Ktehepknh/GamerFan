<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerFan | Социальная сеть для геймеров</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f13; --card-bg: #1a1a24; --text-main: #e0e0e0; --text-sec: #a0a0b0;
            --accent: #ff0055; --accent-glow: rgba(255, 0, 85, 0.4); --primary: #00d4ff;
            --border: #2a2a35; --success: #00ff88; --danger: #ff3333;
        }
        [data-theme="dark"] { --bg-color: #0a0a0a; --card-bg: #141414; --text-main: #fff; --text-sec: #ccc; --accent: #ff4757; --primary: #fff; --border: #333; }
        [data-theme="black"] { --bg-color: #000; --card-bg: #0a0a0a; --text-main: #fff; --text-sec: #aaa; --accent: #ff4757; --primary: #fff; --border: #222; }
        [data-theme="light"] { --bg-color: #f5f5f5; --card-bg: #fff; --text-main: #1a1a1a; --text-sec: #555; --accent: #ff4757; --primary: #1a1a1a; --border: #ddd; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-color); color: var(--text-main); transition: 0.3s; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        h1, h2, h3, .logo { font-family: 'Orbitron', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a24 0%, #000 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: rgba(26,26,36,0.95); padding: 40px; border-radius: 15px; border: 1px solid var(--accent); box-shadow: 0 0 20px var(--accent-glow); text-align: center; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px; font-size: 16px; }
        .login-input select { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px; font-size: 16px; }
        .btn { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 5px; width: 100%; margin-top: 10px; font-family: 'Orbitron', sans-serif; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-sm { width: auto; padding: 5px 15px; font-size: 12px; }
        .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.8; }
        .auth-link { color: var(--accent); cursor: pointer; text-decoration: none; font-size: 14px; }
        .auth-link:hover { text-decoration: underline; }

        #app { display: none; height: 100%; flex-direction: column; }
        #app.visible { display: flex; }

        header { height: 55px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; }
        .logo { font-size: 22px; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); cursor: pointer; }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { cursor: pointer; color: var(--text-sec); font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 5px; }
        .nav-item:hover, .nav-item.active { color: var(--primary); }
        .user-mini { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .mini-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; background: #333; }

        main { flex: 1; overflow-y: auto; padding: 15px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #333; }
        .post-nick { font-weight: bold; color: var(--primary); }
        .post-time { font-size: 11px; color: var(--text-sec); }
        .post-text { margin: 10px 0; white-space: pre-wrap; line-height: 1.5; }
        .post-image { width: 100%; border-radius: 5px; max-height: 300px; object-fit: contain; margin: 10px 0; }
        .post-actions { display: flex; gap: 15px; border-top: 1px solid var(--border); padding-top: 10px; }
        .action-btn { background: none; border: none; color: var(--text-sec); cursor: pointer; font-size: 14px; transition: 0.2s; }
        .action-btn:hover { color: var(--primary); }
        .action-btn.liked { color: var(--accent); }

        .comments { margin-top: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
        .comment { font-size: 13px; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
        .comment-nick { font-weight: bold; color: var(--primary); }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .game-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .game-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .game-icon { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 35px; background: #000; }
        .game-info { padding: 10px; }
        .game-title { font-weight: bold; font-size: 13px; }
        .game-cat { font-size: 11px; color: var(--accent); text-transform: uppercase; }

        .games-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .section-tab { padding: 6px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; color: var(--text-sec); transition: 0.3s; }
        .section-tab.active, .section-tab:hover { background: var(--accent); color: #fff; }

        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 130px); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 14px; border-radius: 15px; }
        .msg-other { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); }
        .msg-me { align-self: flex-end; background: var(--accent); color: #fff; }
        .msg-nick { font-weight: bold; font-size: 12px; margin-bottom: 3px; }
        .msg-text { font-size: 14px; word-wrap: break-word; }
        .msg-time { font-size: 10px; opacity: 0.7; text-align: right; margin-top: 3px; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px; border-top: 1px solid var(--border); }
        .chat-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 10px 15px; border-radius: 20px; color: var(--text-main); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; border: 1px solid var(--accent); position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: var(--text-sec); }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--card-bg); border-left: 4px solid var(--primary); padding: 12px 18px; border-radius: 5px; animation: slideIn 0.3s; font-size: 14px; }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 4000; display: none; flex-direction: column; }
        #game-frame { flex: 1; border: none; }
        #game-header { height: 45px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; }

        .avatar-actions { position: absolute; top: 100%; left: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 5px; padding: 5px; display: none; z-index: 10; }
        .avatar-actions button { display: block; width: 100%; background: none; border: none; color: var(--text-main); padding: 8px 15px; cursor: pointer; text-align: left; font-size: 13px; }
        .avatar-actions button:hover { background: rgba(255,255,255,0.1); }

        .partner-block { text-align: center; padding: 15px; margin-top: 15px; border-top: 1px solid var(--border); }
        .partner-link { color: var(--primary); text-decoration: none; font-size: 14px; }
        .partner-link:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .nav-links span { display: none; }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box" id="auth-box">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- APP -->
    <div id="app">
        <header>
            <div class="logo" onclick="switchTab('feed')">GAMER<span style="color:#fff">FAN</span></div>
            <nav class="nav-links">
                <div class="nav-item active" data-tab="feed"><i class="fas fa-home"></i> <span>Лента</span></div>
                <div class="nav-item" data-tab="games"><i class="fas fa-gamepad"></i> <span>Игры</span></div>
                <div class="nav-item" data-tab="events"><i class="fas fa-calendar"></i> <span>Ивенты</span></div>
                <div class="nav-item" data-tab="chat"><i class="fas fa-comments"></i> <span>Чат</span></div>
                <div class="nav-item" data-tab="settings"><i class="fas fa-cog"></i> <span>Настройки</span></div>
                <div class="nav-item hidden" id="adminNavBtn" data-tab="admin"><i class="fas fa-shield-alt"></i> <span>Админ</span></div>
            </nav>
            <div class="user-mini" onclick="switchTab('settings')">
                <img id="header-avatar" class="mini-avatar" src="">
                <span id="header-nick" style="font-weight:bold;"></span>
            </div>
        </header>

        <main>
            <!-- FEED -->
            <section id="feed" class="section active">
                <div class="card" style="display:flex; gap:10px; align-items:center;">
                    <img id="feed-avatar" class="mini-avatar" style="width:45px; height:45px;" src="">
                    <div style="flex:1; color:var(--text-sec); cursor:pointer;" onclick="openPostModal()">О чем думаешь, геймер?</div>
                    <button class="btn btn-sm" onclick="openPostModal()">Пост</button>
                </div>
                <div id="feed-container"></div>
            </section>

            <!-- GAMES -->
            <section id="games" class="section">
                <h2 style="margin-bottom:15px;">🎮 Библиотека игр</h2>
                <div class="games-tabs" id="games-tabs">
                    <div class="section-tab active" data-cat="all">Все</div>
                    <div class="section-tab" data-cat="slime">Slime</div>
                    <div class="section-tab" data-cat="elberr_old">ELBERR OS</div>
                    <div class="section-tab" data-cat="elberr_new">Remake</div>
                    <div class="section-tab" data-cat="dlc">DLC</div>
                    <div class="section-tab" data-cat="daardos">Daardos</div>
                </div>
                <div class="games-grid" id="games-container"></div>
            </section>

            <!-- EVENTS -->
            <section id="events" class="section">
                <h2 style="margin-bottom:15px;">📅 Ивенты</h2>
                <button class="btn btn-sm" onclick="checkAdmin()" style="margin-bottom:10px;">🔑 Админ (создать ивент)</button>
                <div id="events-container"></div>
            </section>

            <!-- CHAT -->
            <section id="chat" class="section">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div style="text-align:center; color:var(--text-sec);">💬 Чат загружается...</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="msg-input" class="chat-input" placeholder="Напишите сообщение...">
                        <button class="btn btn-sm" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>

            <!-- SETTINGS -->
            <section id="settings" class="section">
                <div class="card">
                    <h3>👤 Мой профиль</h3>
                    <div style="position:relative; display:inline-block;">
                        <img id="settings-avatar" style="width:80px; height:80px; border-radius:50%; object-fit:cover; background:#333; cursor:pointer;" onclick="toggleAvatarMenu()">
                        <div id="avatar-menu" class="avatar-actions">
                            <button onclick="viewAvatar()">🔍 Посмотреть фото</button>
                            <button onclick="document.getElementById('settings-upload').click()">📤 Обновить фото</button>
                            <button onclick="deleteAvatar()">🗑️ Удалить фото</button>
                        </div>
                    </div>
                    <input type="file" id="settings-upload" accept="image/*" style="display:none;" onchange="uploadSettingsAvatar(this)">
                    <p style="margin-top:10px;"><strong id="settings-nick-display"></strong></p>
                    <p style="font-size:12px; color:var(--text-sec);">Email: <span id="settings-email"></span></p>
                    <p style="font-size:12px; color:var(--text-sec);">Имя: <span id="settings-name"></span></p>
                    
                    <label style="margin-top:15px; display:block;">Сменить ник:</label>
                    <div style="display:flex; gap:10px; margin:5px 0;">
                        <input type="text" id="new-nick" class="login-input" style="margin:0;" placeholder="Новый ник">
                        <button class="btn btn-sm" onclick="changeNick()">OK</button>
                    </div>
                </div>
                <div class="card">
                    <h3>🎨 Тема</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                        <button class="btn btn-sm" onclick="setTheme('cyberpunk')" style="width:100%;">🎮 Киберпанк</button>
                        <button class="btn btn-sm" onclick="setTheme('dark')" style="width:100%;">🌙 Тёмная</button>
                        <button class="btn btn-sm" onclick="setTheme('black')" style="width:100%;">🖤 Чёрная</button>
                        <button class="btn btn-sm" onclick="setTheme('light')" style="width:100%;">☀️ Светлая</button>
                    </div>
                </div>
                <button class="btn btn-danger" onclick="logout()">🚪 Выйти</button>
            </section>

            <!-- ADMIN -->
            <section id="admin" class="section">
                <h2>👑 Панель администратора</h2>
                <div class="card">
                    <h3>Пользователи</h3>
                    <div id="admin-users-list"></div>
                </div>
            </section>
        </main>

        <footer class="partner-block">
            <p style="font-size:11px; opacity:0.7;">НАШ ПАРТНЕР</p>
            <a href="https://daardos.github.io/the_daardos/" target="_blank" class="partner-link">
                <i class="fas fa-external-link-alt"></i> The Daardos Project
            </a>
        </footer>
    </div>

    <!-- POST MODAL -->
    <div id="post-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closePostModal()">&times;</span>
            <h3>Новый пост</h3>
            <textarea id="post-text" class="login-input" rows="4" placeholder="Текст поста..." style="margin-top:10px;"></textarea>
            <input type="text" id="post-image" class="login-input" placeholder="Ссылка на картинку (необязательно)">
            <button class="btn" onclick="createPost()" style="margin-top:15px;">Опубликовать</button>
        </div>
    </div>

    <!-- GAME OVERLAY -->
    <div id="game-overlay">
        <div id="game-header">
            <span id="game-title-display">Game</span>
            <button class="btn btn-sm" onclick="closeGame()">Закрыть</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <!-- AVATAR VIEW MODAL -->
    <div id="avatar-view-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center;">
            <span class="close-modal" onclick="document.getElementById('avatar-view-modal').style.display='none'">&times;</span>
            <img id="avatar-view-img" style="max-width:100%; max-height:70vh; border-radius:10px;">
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ============ КОНФИГ ============
        const API_URL = 'https://gamerfan.vetrovlev1.workers.dev/api';
        const IMGBB_KEY = 'b80b9e18e607bfe48e6c03a19289c465';
        const BASE_PATH = '/GamerFan';

        const GAMES = [
            {name:"Slime Clicker 2D",path:BASE_PATH+"/Slime_Clicker/index.html",icon:"🧪",cat:"slime"},
            {name:"Slime Farm 2D",path:BASE_PATH+"/Slime_Farm_2D/index.html",icon:"🚜",cat:"slime"},
            {name:"Slime Farm 2",path:BASE_PATH+"/Slime_Farm2/index.html",icon:"🍄",cat:"slime"},
            {name:"ELBERR OS: Ch 1",path:BASE_PATH+"/ELBERR_OS/Chapter1/index.html",icon:"💾",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 2",path:BASE_PATH+"/ELBERR_OS/Chapter2/index.html",icon:"🔐",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 3",path:BASE_PATH+"/ELBERR_OS/Chapter3/index.html",icon:"⚙️",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 4",path:BASE_PATH+"/ELBERR_OS/Chapter4/index.html",icon:"💿",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 5",path:BASE_PATH+"/ELBERR_OS/Chapter5/index.html",icon:"📡",cat:"elberr_old"},
            {name:"ELBERR OS: Ch 6",path:BASE_PATH+"/ELBERR_OS/Chapter6/index.html",icon:"🧠",cat:"elberr_old"},
            {name:"ELBERR OS R: Ch 1",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter1/index.html",icon:"🆕",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 2",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter2/index.html",icon:"✨",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 3",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter3/index.html",icon:"🚀",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 4",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter4/index.html",icon:"💫",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 5",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter5/index.html",icon:"⚡",cat:"elberr_new"},
            {name:"ELBERR OS R: Ch 6",path:BASE_PATH+"/ELBERR_OS_REMAKE/Chapter6/index.html",icon:"🔥",cat:"elberr_new"},
            {name:"RTAP DLC",path:BASE_PATH+"/ELBERR_OS_REMAKE/RTAP/index.html",icon:"🦾",cat:"dlc"},
            {name:"TAD DLC",path:BASE_PATH+"/ELBERR_OS_REMAKE/TAD/index.html",icon:"🔥",cat:"dlc"},
            {name:"TPD DLC",path:BASE_PATH+"/ELBERR_OS_REMAKE/TPD/index.html",icon:"🔥",cat:"dlc"},
            {name:"Neon Bird",path:BASE_PATH+"/daardos/neon_bird/index.html",icon:"🐦",cat:"daardos"}
        ];

        // ============ СОСТОЯНИЕ ============
        let token = '';
        let currentUser = null;

        // ============ УТИЛИТЫ ============
        function $(id) { return document.getElementById(id); }
        function toast(msg, err) {
            const t = document.createElement('div');
            t.className = 'toast' + (err ? ' error' : '');
            t.textContent = msg;
            $('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        // ============ API ============
        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (token) opts.headers['Authorization'] = `Bearer ${token}`;
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API_URL + path, opts);
            return res.json();
        }

        // ============ АВАТАР ImgBB ============
        async function uploadToImgBB(file) {
            const fd = new FormData();
            fd.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:'POST', body:fd});
            const data = await res.json();
            return data.success ? data.data.url : null;
        }

        window.uploadSettingsAvatar = async function(input) {
            const file = input.files[0];
            if (!file) return;
            const url = await uploadToImgBB(file);
            if (url) {
                await api('/profile', 'PUT', { nickname: currentUser.nickname, avatar: url, theme: currentUser.theme });
                currentUser.avatar = url;
                updateAllAvatars();
                toast('✅ Аватар обновлён!');
            }
        };

        function toggleAvatarMenu() {
            const menu = $('avatar-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function viewAvatar() {
            if (currentUser.avatar) {
                $('avatar-view-img').src = currentUser.avatar;
                $('avatar-view-modal').style.display = 'flex';
            } else {
                toast('Нет аватара', true);
            }
        }

        async function deleteAvatar() {
            if (!confirm('Удалить аватар?')) return;
            await api('/profile', 'PUT', { nickname: currentUser.nickname, avatar: null, theme: currentUser.theme });
            currentUser.avatar = '';
            updateAllAvatars();
            toast('🗑️ Аватар удалён');
        }

        function updateAllAvatars() {
            const av = currentUser?.avatar || '';
            const def = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23555%22%3E%3Cpath d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%22/%3E%3C/svg%3E';
            const src = av || def;
            $('header-avatar').src = src;
            $('feed-avatar').src = src;
            $('settings-avatar').src = src;
            $('settings-email').textContent = currentUser?.email || '';
            $('settings-name').textContent = currentUser?.name || '';
            $('settings-nick-display').textContent = currentUser?.nickname || '';
            $('header-nick').textContent = currentUser?.nickname || '';
        }

        // ============ АВТОРИЗАЦИЯ ============
        function showAuthForm(mode) {
            const box = $('auth-box');
            if (mode === 'login') {
                box.innerHTML = `
                    <h1 class="logo" style="margin-bottom:20px;">GAMER<span style="color:#fff">FAN</span></h1>
                    <h3 style="color:var(--primary); margin-bottom:15px;">Вход</h3>
                    <input type="email" id="auth-email" class="login-input" placeholder="Email">
                    <input type="password" id="auth-pass" class="login-input" placeholder="Пароль">
                    <button class="btn" onclick="login()">Войти</button>
                    <p style="margin-top:15px; font-size:14px; color:var(--text-sec);">
                        Нет аккаунта? <a class="auth-link" onclick="showAuthForm('register')">Зарегистрироваться</a>
                    </p>
                `;
            } else {
                box.innerHTML = `
                    <h1 class="logo" style="margin-bottom:20px;">GAMER<span style="color:#fff">FAN</span></h1>
                    <h3 style="color:var(--primary); margin-bottom:15px;">Регистрация</h3>
                    <input type="email" id="reg-email" class="login-input" placeholder="Email">
                    <input type="text" id="reg-name" class="login-input" placeholder="Имя">
                    <input type="text" id="reg-nick" class="login-input" placeholder="Никнейм">
                    <input type="password" id="reg-pass" class="login-input" placeholder="Пароль">
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="reg-day" class="login-input" placeholder="День" min="1" max="31">
                        <input type="number" id="reg-month" class="login-input" placeholder="Месяц" min="1" max="12">
                        <input type="number" id="reg-year" class="login-input" placeholder="Год" min="1900" max="2020">
                    </div>
                    <button class="btn" onclick="register()">Зарегистрироваться</button>
                    <p style="margin-top:15px; font-size:14px; color:var(--text-sec);">
                        Есть аккаунт? <a class="auth-link" onclick="showAuthForm('login')">Войти</a>
                    </p>
                `;
            }
        }

        async function register() {
            const email = $('reg-email').value.trim();
            const name = $('reg-name').value.trim();
            const nickname = $('reg-nick').value.trim();
            const password = $('reg-pass').value;
            const birthDay = parseInt($('reg-day').value);
            const birthMonth = parseInt($('reg-month').value);
            const birthYear = parseInt($('reg-year').value);

            if (!email || !name || !nickname || !password || !birthDay || !birthMonth || !birthYear) {
                return toast('Все поля обязательны', true);
            }

            const res = await api('/auth/register', 'POST', { email, password, name, nickname, birthDay, birthMonth, birthYear });
            if (res.error) return toast(res.error, true);
            
            token = res.token;
            currentUser = res.user;
            enterApp();
            toast('✅ Регистрация успешна!');
        }

        async function login() {
            const email = $('auth-email').value.trim();
            const password = $('auth-pass').value;
            if (!email || !password) return toast('Email и пароль обязательны', true);

            const res = await api('/auth/login', 'POST', { email, password });
            if (res.error) return toast(res.error, true);
            
            token = res.token;
            currentUser = res.user;
            enterApp();
            toast('👋 С возвращением!');
        }

        function enterApp() {
            $('login-screen').style.display = 'none';
            $('app').classList.add('visible');
            updateAllAvatars();
            loadFeed();
            loadGames('all');
            loadEvents();
            loadChat();
            if (currentUser.theme) setTheme(currentUser.theme);
        }

        async function logout() {
            token = '';
            currentUser = null;
            $('app').classList.remove('visible');
            $('login-screen').style.display = 'flex';
            showAuthForm('login');
        }

        async function changeNick() {
            const newNick = $('new-nick').value.trim();
            if (!newNick) return;
            const res = await api('/profile', 'PUT', { nickname: newNick, avatar: currentUser.avatar, theme: currentUser.theme });
            if (res.error) return toast(res.error, true);
            currentUser.nickname = newNick;
            updateAllAvatars();
            $('new-nick').value = '';
            toast('✅ Ник изменён!');
        }

        // ============ НАВИГАЦИЯ ============
        function switchTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            $(id).classList.add('active');
            const nav = document.querySelector(`[data-tab="${id}"]`);
            if (nav) nav.classList.add('active');
            if (id === 'feed') loadFeed();
            if (id === 'chat') loadChat();
            if (id === 'events') loadEvents();
            if (id === 'games') loadGames('all');
            if (id === 'admin') loadAdminPanel();
        }

        // ============ ЛЕНТА ============
        function openPostModal() { $('post-modal').style.display = 'flex'; }
        function closePostModal() { $('post-modal').style.display = 'none'; $('post-text').value = ''; $('post-image').value = ''; }

        async function createPost() {
            const text = $('post-text').value.trim();
            const image = $('post-image').value.trim();
            if (!text && !image) return toast('Введите текст или ссылку на картинку', true);
            await api('/posts', 'POST', { text, image });
            closePostModal();
            toast('✅ Пост опубликован!');
            loadFeed();
        }

        async function loadFeed() {
            const data = await api('/posts');
            const container = $('feed-container');
            if (!data || !data.length) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-sec);">Лента пуста. Будьте первым!</div>';
                return;
            }
            container.innerHTML = '';
            for (const post of data) {
                const likes = JSON.parse(post.likes || '[]');
                const liked = likes.includes(currentUser?.nickname);
                container.innerHTML += `
                    <div class="card">
                        <div class="post-header">
                            <img src="${post.avatar || ''}" class="post-avatar" onerror="this.style.display='none'">
                            <div>
                                <div class="post-nick">${esc(post.nick)}</div>
                                <div class="post-time">${new Date(post.time).toLocaleString('ru-RU')}</div>
                            </div>
                        </div>
                        ${post.text ? `<div class="post-text">${esc(post.text)}</div>` : ''}
                        ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                <i class="fas fa-heart"></i> ${likes.length}
                            </button>
                            <button class="action-btn" onclick="toggleComments(${post.id})">
                                <i class="fas fa-comment"></i> ${post.commentsCount || 0}
                            </button>
                        </div>
                        <div id="comments-${post.id}" class="comments" style="display:none;"></div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <input type="text" id="comment-input-${post.id}" class="login-input" style="margin:0; font-size:13px; padding:6px;" placeholder="Комментарий...">
                            <button class="btn btn-sm" onclick="addComment(${post.id})">OK</button>
                        </div>
                    </div>
                `;
            }
        }

        async function toggleLike(postId) {
            await api(`/posts/${postId}/like`, 'POST');
            loadFeed();
        }

        async function toggleComments(postId) {
            const div = $(`comments-${postId}`);
            if (div.style.display === 'none') {
                const data = await api(`/posts/${postId}/comments`);
                div.innerHTML = (data || []).map(c => `
                    <div class="comment">
                        <span class="comment-nick">${esc(c.nick)}</span>: ${esc(c.text)}
                    </div>
                `).join('') || '<div style="color:var(--text-sec);">Нет комментариев</div>';
                div.style.display = 'block';
            } else {
                div.style.display = 'none';
            }
        }

        async function addComment(postId) {
            const input = $(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            await api(`/posts/${postId}/comments`, 'POST', { text });
            input.value = '';
            loadFeed();
        }

        // ============ ИГРЫ ============
        function loadGames(cat) {
            const filtered = cat === 'all' ? GAMES : GAMES.filter(g => g.cat === cat);
            $('games-container').innerHTML = filtered.map(g => `
                <div class="game-card" onclick="launchGame('${g.path}','${g.name}')">
                    <div class="game-icon">${g.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${g.name}</div>
                        <div class="game-cat">${g.cat}</div>
                    </div>
                </div>
            `).join('');
        }

        function launchGame(path, name) {
            $('game-title-display').textContent = name;
            $('game-frame').src = path;
            $('game-overlay').style.display = 'flex';
        }

        function closeGame() {
            $('game-overlay').style.display = 'none';
            $('game-frame').src = '';
        }

        // ============ ЧАТ ============
        async function sendMessage() {
            const text = $('msg-input').value.trim();
            if (!text) return;
            await api('/chat', 'POST', { text });
            $('msg-input').value = '';
            loadChat();
        }

        async function loadChat() {
            const data = await api('/chat');
            const container = $('chat-messages');
            container.innerHTML = (data || []).map(m => `
                <div class="msg ${m.nick === currentUser?.nickname ? 'msg-me' : 'msg-other'}">
                    ${m.nick !== currentUser?.nickname ? `<div class="msg-nick">${esc(m.nick)}</div>` : ''}
                    <div class="msg-text">${esc(m.text)}</div>
                    <div class="msg-time">${new Date(m.time).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'})}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        // ============ ИВЕНТЫ ============
        async function loadEvents() {
            const data = await api('/events');
            $('events-container').innerHTML = (data || []).map(e => `
                <div class="card" style="border-left:4px solid ${e.status==='active'?'var(--success)':'var(--border)'}">
                    <div style="font-size:12px; color:var(--accent);">${e.status==='active'?'🟢 Активен':'🔜 Предстоящий'}</div>
                    <h3>${esc(e.title)}</h3>
                    ${e.desc ? `<p style="color:var(--text-sec); margin:5px 0;">${esc(e.desc)}</p>` : ''}
                    ${e.gameName ? `<div style="margin-top:10px;">${e.gameIcon || '🎮'} ${esc(e.gameName)}</div>` : ''}
                </div>
            `).join('') || '<div style="text-align:center; color:var(--text-sec);">Нет активных ивентов</div>';
        }

        async function checkAdmin() {
            const pwd = prompt('Введите админ-пароль:');
            if (!pwd) return;
            const res = await api('/admin/check', 'POST', { password: pwd });
            if (res.admin) {
                sessionStorage.setItem('admin_pwd', pwd);
                $('adminNavBtn').classList.remove('hidden');
                switchTab('admin');
                toast('✅ Доступ разрешён');
            } else {
                toast('❌ Неверный пароль', true);
            }
        }

        async function loadAdminPanel() {
            const pwd = sessionStorage.getItem('admin_pwd') || '';
            const opts = { headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pwd}` } };
            const res = await fetch(API_URL + '/admin/users', opts);
            const data = await res.json();
            
            const container = $('admin-users-list');
            if (data.error) {
                container.innerHTML = '<p style="color:var(--danger);">Нет доступа</p>';
                return;
            }
            
            container.innerHTML = (data || []).map(u => `
                <div class="card" style="cursor:pointer;" onclick="toggleUserInfo(${u.id})">
                    <strong>${esc(u.nickname)}</strong> (${esc(u.name)}) - ${esc(u.email)}
                    <div id="user-info-${u.id}" style="display:none; margin-top:10px; font-size:13px; color:var(--text-sec);">
                        <p>📧 Email: ${esc(u.email)}</p>
                        <p>🔑 Пароль: ${esc(u.password)}</p>
                        <p>👤 Имя: ${esc(u.name)}</p>
                        <p>🎂 Дата рождения: ${u.birthDay}.${u.birthMonth}.${u.birthYear}</p>
                        <p>🎨 Тема: ${esc(u.theme)}</p>
                        <p>📅 Создан: ${new Date(u.createdAt).toLocaleString('ru-RU')}</p>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}); event.stopPropagation();">🗑️ Удалить</button>
                    </div>
                </div>
            `).join('') || '<p>Нет пользователей</p>';
        }

        window.toggleUserInfo = function(id) {
            const div = $(`user-info-${id}`);
            div.style.display = div.style.display === 'none' ? 'block' : 'none';
        };

        window.deleteUser = async function(id) {
            if (!confirm('Точно удалить пользователя?')) return;
            const pwd = sessionStorage.getItem('admin_pwd') || '';
            await fetch(API_URL + `/admin/users/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pwd}` }
            });
            toast('🗑️ Пользователь удалён');
            loadAdminPanel();
        };

        // ============ ТЕМЫ ============
        function setTheme(t) {
            if (t === 'cyberpunk') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', t);
            if (currentUser) {
                currentUser.theme = t;
                api('/profile', 'PUT', { nickname: currentUser.nickname, avatar: currentUser.avatar, theme: t });
            }
        }

        // ============ ХОТКЕИ ============
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closePostModal(); closeGame(); $('avatar-view-modal').style.display='none'; }
            if (e.ctrlKey && e.key === 'Enter') {
                if ($('msg-input') === document.activeElement) sendMessage();
            }
        });

        // ============ ИНИТ ============
        document.addEventListener('DOMContentLoaded', () => {
            showAuthForm('login');
            
            $('auth-box').addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    if ($('reg-email')) register();
                    else login();
                }
            });
            
            document.querySelectorAll('[data-tab]').forEach(el => {
                el.addEventListener('click', () => switchTab(el.dataset.tab));
            });
            
            $('games-tabs').addEventListener('click', e => {
                const tab = e.target.closest('.section-tab');
                if (tab) {
                    document.querySelectorAll('#games-tabs .section-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadGames(tab.dataset.cat);
                }
            });
            
            $('msg-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') sendMessage();
            });

            document.addEventListener('click', e => {
                if (!e.target.closest('#settings-avatar') && !e.target.closest('#avatar-menu')) {
                    $('avatar-menu').style.display = 'none';
                }
            });

            setInterval(() => {
                if ($('chat').classList.contains('active')) loadChat();
            }, 3000);

            setInterval(() => {
                if ($('feed').classList.contains('active')) loadFeed();
            }, 10000);
        });
    </script>
</body>
</html>
